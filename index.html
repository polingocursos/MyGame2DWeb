<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <!-- user-scalable=no evita zoom acidental ao tocar 2x -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <!-- Solicita orientação landscape ao sistema (suporte parcial em Android Chrome) -->
  <meta name="screen-orientation" content="landscape" />
  <title>Adventure Quest 2D</title>
  <!-- ✅ Pré-carrega o bundle principal antes do body carregar -->
  <link rel="modulepreload" href="/src/main.js">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      width: 100%; height: 100%;
      background: #05050f;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      /* Previne seleção de texto ao arrastar controles touch */
      user-select: none;
      -webkit-user-select: none;
      touch-action: none;
    }

    /* ── Tela de "Gire o celular" (portrait only) ──────────── */
    #rotate-screen {
      display: none;
      position: fixed;
      inset: 0;
      z-index: 9999;
      background: #05050f;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      color: #fff;
      font-family: 'Segoe UI', sans-serif;
      text-align: center;
      padding: 24px;
    }

    #rotate-screen .rotate-icon {
      font-size: 72px;
      margin-bottom: 20px;
      animation: rotate-hint 1.8s ease-in-out infinite;
      display: block;
    }

    @keyframes rotate-hint {
      0%   { transform: rotate(0deg);   }
      30%  { transform: rotate(-90deg); }
      60%  { transform: rotate(-90deg); }
      90%  { transform: rotate(0deg);   }
      100% { transform: rotate(0deg);   }
    }

    #rotate-screen h2 {
      font-size: 22px;
      font-weight: 600;
      letter-spacing: 2px;
      color: rgba(255,255,255,0.9);
      margin-bottom: 10px;
    }

    #rotate-screen p {
      font-size: 14px;
      color: rgba(255,255,255,0.45);
      letter-spacing: 1px;
    }

    /* ── Container do jogo — responsivo ───────────────────────
       Usa aspect-ratio 16/9 + vw/vh para escalar mantendo proporção */
    #game-wrapper {
      position: relative;
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    #game-container {
      position: relative;
      /* Desktop: máximo 1280×720. Mobile: escala para caber na tela (16:9) */
      width:  min(1280px, min(100vw, 177.78vh));
      height: min(720px,  min(56.25vw, 100vh));
      box-shadow: 0 0 80px rgba(74, 158, 255, 0.3);
    }

    canvas {
      display: block;
      width: 100% !important;
      height: 100% !important;
    }

    /* ── Loading screen ────────────────────────────────────── */
    #loading-screen {
      position: absolute;
      inset: 0;
      background: #05050f;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      color: #fff;
      z-index: 100;
      font-family: 'Segoe UI', sans-serif;
      transition: opacity 0.5s ease;
    }

    #loading-title {
      font-size: 28px;
      letter-spacing: 8px;
      font-weight: 300;
      color: rgba(255,255,255,0.9);
      margin-bottom: 8px;
      text-transform: uppercase;
    }

    #loading-sub {
      font-size: 13px;
      letter-spacing: 2px;
      color: rgba(255,255,255,0.35);
      margin-bottom: 28px;
    }

    #loading-bar-bg {
      width: 320px;
      height: 3px;
      background: rgba(255,255,255,0.08);
      border-radius: 2px;
      overflow: hidden;
    }

    #loading-bar {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, #4a9eff, #a855f7);
      border-radius: 2px;
      transition: width 0.4s cubic-bezier(0.4, 0, 0.2, 1);
    }

    /* ── Touch Controls overlay ────────────────────────────── */
    #touch-controls {
      display: none;            /* JS ativa em mobile */
      position: absolute;
      inset: 0;
      pointer-events: none;     /* deixa o canvas receber eventos normais */
      z-index: 200;
    }

    /* Joystick esquerdo */
    #joy-zone {
      position: absolute;
      left: 0;
      bottom: 0;
      width: 45%;
      height: 55%;
      pointer-events: all;
      /* debug: background: rgba(255,0,0,0.05); */
    }

    #joy-base {
      position: absolute;
      width: 110px;
      height: 110px;
      border-radius: 50%;
      background: rgba(255,255,255,0.08);
      border: 2px solid rgba(255,255,255,0.18);
      bottom: 24px;
      left: 24px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    #joy-knob {
      width: 46px;
      height: 46px;
      border-radius: 50%;
      background: radial-gradient(circle at 35% 35%, rgba(255,255,255,0.55), rgba(74,158,255,0.7));
      border: 2px solid rgba(255,255,255,0.35);
      position: absolute;
      top: 50%; left: 50%;
      transform: translate(-50%, -50%);
      transition: none;
    }

    /* Botão pulo direito */
    #btn-jump {
      position: absolute;
      right: 24px;
      bottom: 30px;
      width: 80px;
      height: 80px;
      border-radius: 50%;
      background: radial-gradient(circle at 35% 35%, rgba(168,85,247,0.9), rgba(74,158,255,0.8));
      border: 2px solid rgba(255,255,255,0.35);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 28px;
      pointer-events: all;
      cursor: pointer;
      box-shadow: 0 0 20px rgba(168,85,247,0.5);
      transition: transform 0.1s, box-shadow 0.1s;
    }

    #btn-jump:active,
    #btn-jump.pressed {
      transform: scale(0.9);
      box-shadow: 0 0 10px rgba(168,85,247,0.3);
    }

    /* Setas direcionais (alternativa ao joystick em botões fixos) */
    #dpad {
      position: absolute;
      left: 20px;
      bottom: 20px;
      display: flex;
      gap: 6px;
      align-items: center;
      pointer-events: all;
    }

    .dpad-btn {
      width: 56px;
      height: 56px;
      border-radius: 12px;
      background: rgba(255,255,255,0.10);
      border: 2px solid rgba(255,255,255,0.20);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 22px;
      cursor: pointer;
      pointer-events: all;
      transition: background 0.1s;
      -webkit-tap-highlight-color: transparent;
    }

    .dpad-btn:active,
    .dpad-btn.pressed {
      background: rgba(74,158,255,0.35);
      border-color: rgba(74,158,255,0.6);
    }
  </style>
</head>
<body>

  <!-- ── Tela de rotação (aparece no portrait) ──────────── -->
  <div id="rotate-screen">
    <span class="rotate-icon">📱</span>
    <h2>GIRE O CELULAR</h2>
    <p>Este jogo funciona em modo<br>horizontal (landscape)</p>
  </div>

  <!-- Captura erros antes mesmo do módulo JS carregar -->
  <script>
    window.onerror = function(msg, src, line, col, err) {
      var el = document.getElementById('loading-sub');
      if (el) el.textContent = '\u274C Erro JS: ' + msg;
    };
    window.addEventListener('unhandledrejection', function(e) {
      var el = document.getElementById('loading-sub');
      if (el) el.textContent = '\u274C Promise: ' + (e.reason && e.reason.message ? e.reason.message : String(e.reason));
    });

    // ── Detectar orientação e mostrar tela de rotação ─────
    function checkOrientation() {
      var isPortrait = window.innerHeight > window.innerWidth;
      var isMobile   = /Mobi|Android|iPhone|iPad/i.test(navigator.userAgent)
                    || ('ontouchstart' in window && window.innerWidth < 1024);
      var rs = document.getElementById('rotate-screen');
      if (rs) rs.style.display = (isMobile && isPortrait) ? 'flex' : 'none';
    }

    window.addEventListener('resize',            checkOrientation);
    window.addEventListener('orientationchange', checkOrientation);
    checkOrientation();

    // Tenta solicitar lock de orientação landscape (Android Chrome suporta)
    if (screen.orientation && screen.orientation.lock) {
      screen.orientation.lock('landscape').catch(function() {
        /* silencioso — iOS não suporta */
      });
    }
  </script>

  <div id="game-wrapper">
    <div id="game-container">
      <div id="loading-screen">
        <div id="loading-title">Adventure Quest</div>
        <div id="loading-sub">Carregando mundo...</div>
        <div id="loading-bar-bg">
          <div id="loading-bar"></div>
        </div>
      </div>

      <!-- ── Touch Controls (visíveis só em mobile landscape) ── -->
      <div id="touch-controls">
        <!-- D-Pad: ← → -->
        <div id="dpad">
          <div class="dpad-btn" id="btn-left"  data-action="left">◀</div>
          <div class="dpad-btn" id="btn-right" data-action="right">▶</div>
        </div>

        <!-- Pulo -->
        <div id="btn-jump">⬆</div>
      </div>
    </div>
  </div>

  <script type="module" src="/src/main.js"></script>
</body>
</html>
